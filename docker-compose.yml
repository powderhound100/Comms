services:
  groundlink-dashboard:
    build:
      context: ./phase5_dashboard
      dockerfile: Dockerfile
    container_name: groundlink-dashboard
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - SCANNER_API_URL=http://host.docker.internal:8766
      - SCANNER_WS_URL=ws://host.docker.internal:8765
      - RADIO_WS_URL=ws://10.0.0.245:8770
      - SDR_AGENT_URL=http://host.docker.internal:8780
      - PI_AGENT_URL=http://10.0.0.245:8781
      - NEXT_PUBLIC_PI_HOST=10.0.0.245
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: groundlink-tunnel
    restart: unless-stopped
    network_mode: host
    command: tunnel --config /etc/cloudflared/config.yml run groundlink
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - groundlink-dashboard
